import numpy as np

def entropy(y):
    # Расчет энтропии для меток классов
    class_counts = np.bincount(y)
    probs = class_counts / len(y)
    return -np.sum(probs * np.log2(probs + 1e-9))  # Добавляем маленькую константу для предотвращения логарифма от нуля

def information_gain(X, y, feature_idx):
    # Получение уникальных значений признака для поиска порога
    feature_values = X[:, feature_idx]
    sorted_indices = np.argsort(feature_values)
    sorted_X = X[sorted_indices]
    sorted_y = y[sorted_indices]
    
    # Начальная энтропия для всей выборки
    initial_entropy = entropy(sorted_y)
    
    # Сумма энтропий для разбиений
    best_ig = -np.inf
    best_split_value = None

    for i in range(1, len(sorted_X)):
        if sorted_X[i] == sorted_X[i - 1]:
            continue  # Пропускаем одинаковые значения (нет смысла разбиение между одинаковыми значениями)

        left_y = sorted_y[:i]
        right_y = sorted_y[i:]

        # Расчет энтропий для левой и правой группы
        left_entropy = entropy(left_y)
        right_entropy = entropy(right_y)

        # Средневзвешенная энтропия после разделения
        weighted_entropy = (len(left_y) / len(sorted_y)) * left_entropy + (len(right_y) / len(sorted_y)) * right_entropy

        # Вычисляем Information Gain
        ig = initial_entropy - weighted_entropy

        if ig > best_ig:
            best_ig = ig
            best_split_value = (sorted_X[i - 1] + sorted_X[i]) / 2  # Порог для разбиения - среднее значение

    return best_ig, best_split_value

def best_split(X, y):
    # Перебор всех признаков
    best_ig = -np.inf
    best_feature_idx = -1
    best_split_value = None
    
    for feature_idx in range(X.shape[1]):
        ig, split_value = information_gain(X, y, feature_idx)
        if ig > best_ig:
            best_ig = ig
            best_feature_idx = feature_idx
            best_split_value = split_value

    return best_feature_idx, best_split_value, best_ig

# Пример использования:
X = np.array([[18], [22], [25], [30], [35], [40]])  # Признак (например, возраст)
y = np.array([0, 0, 1, 1, 0, 1])  # Классы

feature_idx, split_value, ig = best_split(X, y)
print(f"Лучший признак: {feature_idx}, Порог: {split_value}, Information Gain: {ig}")
